name: Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build channel
        type: choice
        options:
          - dev
          - release
        default: dev
        required: true
      upload_release:
        description: Upload bundles to a GitHub release
        type: boolean
        default: false
        required: true
      version:
        description: Version in x.y.z format, or leave empty to increment the Cargo patch version
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require a branch
        if: github.ref_type != 'branch'
        run: |
          echo "Run this workflow from a branch so a published version can be recorded."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node .github/scripts/set-version.mjs "$REQUESTED_VERSION"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-22.04
            artifact: linux
          - name: Windows
            runner: windows-latest
            artifact: windows
          - name: macOS
            runner: macos-latest
            artifact: macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Apply build version
        run: node .github/scripts/set-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build development bundles
        if: inputs.build_type == 'dev'
        env:
          BASALT_BUILD_CHANNEL: dev
        run: bun run tauri build --debug

      - name: Build release bundles
        if: inputs.build_type == 'release'
        env:
          BASALT_BUILD_CHANNEL: release
        run: bun run tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: basalt-${{ inputs.build_type }}-${{ needs.prepare.outputs.version }}-${{ matrix.artifact }}
          path: |
            src-tauri/target/debug/bundle/**
            src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish
    if: inputs.upload_release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out build branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record version
        id: commit
        run: |
          node .github/scripts/set-version.mjs "${{ needs.prepare.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.toml src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to ${{ needs.prepare.outputs.version }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "target=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download bundles
        uses: actions/download-artifact@v5
        with:
          pattern: basalt-${{ inputs.build_type }}-${{ needs.prepare.outputs.version }}-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TYPE: ${{ inputs.build_type }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ steps.commit.outputs.target }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mapfile -t files < <(
            find release-assets -type f \
              \( -name '*.AppImage' -o -name '*.deb' \
              -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \)
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installable bundles were downloaded."
            exit 1
          fi

          if [ "$BUILD_TYPE" = "dev" ]; then
            tag="v${VERSION}-dev.${RUN_NUMBER}.${RUN_ATTEMPT}"
            title="Basalt ${VERSION} development build"
            channel_args=(--prerelease)
          else
            tag="v${VERSION}"
            title="Basalt ${VERSION}"
            channel_args=(--latest)
          fi

          gh release create "$tag" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "$title" \
            --generate-notes \
            "${channel_args[@]}"

  publish-aur:
    name: Publish AUR
    if: inputs.upload_release && inputs.build_type == 'release'
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    environment: aur
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Require AUR publishing key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "Add AUR_SSH_PRIVATE_KEY to the aur GitHub Environment before publishing a stable release."
            exit 1
          fi

      - name: Download stable Debian package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/debian"
          gh release download "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.deb' \
            --dir "$RUNNER_TEMP/debian"

      - name: Configure AUR SSH access
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          ssh-keyscan -t ed25519 aur.archlinux.org >> "$HOME/.ssh/known_hosts"
          cat >> "$HOME/.ssh/config" <<EOF
          Host aur.archlinux.org
            IdentityFile $HOME/.ssh/aur
            IdentitiesOnly yes
          EOF

      - name: Update AUR package metadata
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git clone ssh://aur@aur.archlinux.org/basalt-launcher-bin.git "$RUNNER_TEMP/aur"
          mapfile -t debs < <(find "$RUNNER_TEMP/debian" -maxdepth 1 -type f -name '*.deb')
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "Expected exactly one Debian package, found ${#debs[@]}."
            exit 1
          fi
          sha256="$(sha256sum "${debs[0]}" | cut -d ' ' -f 1)"
          node .github/scripts/update-aur-package.mjs "$VERSION" "$sha256" "$RUNNER_TEMP/aur"

      - name: Publish AUR package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/aur"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR metadata is already current."
            exit 0
          fi
          git commit -m "Update to ${VERSION}"
          git push origin master
